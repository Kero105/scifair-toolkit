[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scifair-toolkit"
version = "0.1.0"
description = "Experimental design and statistical analysis helpers for science fair research projects"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Rohan"}
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.urls]
Homepage = "https://github.com/Kero105/scifair-toolkit"
